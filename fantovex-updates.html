<style>
  :root{
    --void: #060907;
    --panel: #0d130f;
    --emerald: #16f2a3;
    --emerald-dim: #0d7a54;
    --emerald-deep: #05261c;
    --mist: #7fa89a;
    --line: rgba(22,242,163,0.14);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    background:var(--void);
    font-family:'Segoe UI', system-ui, sans-serif;
    color:#dfeee7;
  }
  ::selection{ background:var(--emerald-deep); color:#eafff6; }

  header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px;
    background:rgba(6,9,7,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:30px; height:30px; filter:drop-shadow(0 0 6px rgba(22,242,163,0.55)); }
  .brand-word{ font-family:'Georgia', serif; letter-spacing:0.26em; font-size:15px; color:#eafff6; }
  .back-link{
    font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--mist); text-decoration:none; background:none; border:none; cursor:pointer;
    transition:color .25s ease;
  }
  .back-link:hover{ color:var(--emerald); }

  main{ max-width:900px; margin:0 auto; padding:50px 24px 100px; }

  .head{ text-align:center; margin-bottom:20px; }
  .head span{ font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:var(--mist); }
  .head h1{
    font-family:'Georgia', serif; font-weight:400; letter-spacing:0.04em;
    color:#eafff6; font-size:clamp(26px,5vw,38px); margin:10px 0 14px;
  }
  .head p{ color:#5f8577; font-size:14px; max-width:460px; margin:0 auto; line-height:1.7; }

  /* ============ ORBIT ============ */
  .orbit-wrap{
    position:relative;
    width:min(560px, 92vw);
    height:min(560px, 92vw);
    margin:50px auto;
  }
  .orbit-ring{
    position:absolute; inset:0;
    border:1px solid var(--line);
    border-radius:50%;
  }
  .orbit-ring::before{
    content:'';
    position:absolute; inset:0;
    border-radius:50%;
    border:1px solid transparent;
    border-top-color:rgba(22,242,163,0.4);
    animation:ring-spin 24s linear infinite;
  }
  @keyframes ring-spin{ to{ transform:rotate(360deg); } }

  .orbit-center{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:110px; height:110px;
    display:flex; align-items:center; justify-content:center;
  }
  .orbit-center img{
    width:60px; height:60px;
    filter:drop-shadow(0 0 16px rgba(22,242,163,0.5));
    animation:center-pulse 2.6s ease-in-out infinite;
  }
  @keyframes center-pulse{
    0%,100%{ filter:drop-shadow(0 0 12px rgba(22,242,163,0.4)); transform:scale(1); }
    50%{ filter:drop-shadow(0 0 22px rgba(22,242,163,0.75)); transform:scale(1.05); }
  }

  .node{
    position:absolute;
    width:14px; height:14px;
    border-radius:50%;
    background:var(--emerald);
    box-shadow:0 0 10px rgba(22,242,163,0.8);
    cursor:pointer;
    transform:translate(-50%,-50%);
    transition:transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s ease;
  }
  .node:hover, .node.active{
    transform:translate(-50%,-50%) scale(1.5);
    box-shadow:0 0 20px rgba(22,242,163,1);
  }
  .node::after{
    content:'';
    position:absolute; inset:-10px;
    border-radius:50%;
    border:1px solid rgba(22,242,163,0.25);
    animation:node-breathe 2.4s ease-in-out infinite;
  }
  @keyframes node-breathe{ 0%,100%{ opacity:.4; transform:scale(0.9); } 50%{ opacity:.9; transform:scale(1.15); } }

  .node-label{
    position:absolute;
    font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--mist);
    white-space:nowrap;
    transform:translate(-50%, 14px);
    pointer-events:none;
    transition:color .3s ease;
  }
  .node:hover + .node-label, .node.active + .node-label{ color:var(--emerald); }

  /* spokes connecting nodes to center */
  .spoke{
    position:absolute; top:50%; left:50%;
    height:1px;
    background:linear-gradient(to right, rgba(22,242,163,0.35), transparent);
    transform-origin:0 0;
    pointer-events:none;
  }

  @media (max-width:560px){
    .node-label{ display:none; }
  }

  /* ============ DETAIL PANEL ============ */
  .panel{
    max-width:560px; margin:10px auto 0;
    background:linear-gradient(160deg, var(--panel), #070b08);
    border:1px solid var(--line);
    border-radius:10px;
    padding:28px 26px;
    min-height:120px;
    transition:border-color .3s ease;
  }
  .panel-empty{ text-align:center; color:#4a6b5e; font-size:13px; padding:20px 0; }
  .panel-tag{
    font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--emerald); margin-bottom:8px;
  }
  .panel h3{
    font-family:'Georgia', serif; font-weight:400; color:#eafff6;
    font-size:20px; margin:0 0 10px;
  }
  .panel p{ font-size:13px; line-height:1.7; color:#a9c4b9; margin:0; }
  .panel-date{ font-size:11px; color:#5f8577; margin-top:14px; letter-spacing:0.04em; }

  /* stop the animated orbit from making the page scroll sideways on phones */
  html,body{ overflow-x:hidden; }
</style>
</head>
<body>

  <header>
    <div class="brand">
      <img class="brand-mark" src="fantovex-mark.png" alt="Fantovex">
      <span class="brand-word">FANTOVEX</span>
    </div>
    <button class="back-link" onclick="location.href='index.html'">← Back</button>
  </header>

  <main>
    <div class="head">
      <span>What's Next</span>
      <h1>Upcoming Updates</h1>
      <p>We won't stop here — we're growing and building out the community. Tap any point on the orbit to see what's coming.</p>
    </div>

    <div class="orbit-wrap" id="orbitWrap">
      <div class="orbit-ring"></div>
      <div class="orbit-center"><img src="fantovex-mark.png" alt="Fantovex"></div>
      <!-- nodes + spokes injected by JS -->
    </div>

    <div class="panel" id="panel">
      <div class="panel-empty">Select an update above to read more.</div>
    </div>
  </main>

<script>
  const UPDATES = [
    { title:"BGMI Tournaments", tag:"Game Mode", date:"Launching Q4 2026", desc:"Full BGMI tournament format — Solo, Duo, Squad — using the same trusted registration and payout flow as Free Fire." },
    { title:"Live Leaderboards", tag:"Feature", date:"In development", desc:"Real-time standings during tournaments so players can track their rank match by match." },
    { title:"Auto Match Alerts", tag:"Feature", date:"Planned", desc:"Automatic Telegram notifications when your room ID, password, or match time is posted." },
    { title:"Creator Program", tag:"Community", date:"Exploring", desc:"A way for streamers and content creators in our community to get early access and co-host events." },
    { title:"Mobile-First Redesign", tag:"Platform", date:"Ongoing", desc:"Continued refinement of the entire site for faster load times and smoother navigation on mobile." },
    { title:"Clan System", tag:"Community", date:"Under consideration", desc:"Persistent clan profiles so squads can build a track record across multiple tournaments." },
  ];

  const wrap = document.getElementById('orbitWrap');
  const panel = document.getElementById('panel');
  const radius = 46; // percent of wrap size

  UPDATES.forEach((u, i) => {
    const angle = (360 / UPDATES.length) * i - 90; // start at top
    const rad = angle * Math.PI / 180;
    const x = 50 + radius * Math.cos(rad);
    const y = 50 + radius * Math.sin(rad);

    // spoke
    const spoke = document.createElement('div');
    spoke.className = 'spoke';
    const lengthPct = radius;
    spoke.style.width = lengthPct + '%';
    spoke.style.transform = `rotate(${angle}deg)`;
    wrap.appendChild(spoke);

    // node
    const node = document.createElement('div');
    node.className = 'node';
    node.style.left = x + '%';
    node.style.top = y + '%';
    node.dataset.index = i;
    wrap.appendChild(node);

    // label
    const label = document.createElement('div');
    label.className = 'node-label';
    label.style.left = x + '%';
    label.style.top = y + '%';
    label.textContent = u.title;
    wrap.appendChild(label);

    node.addEventListener('click', () => selectUpdate(i));
  });

  function selectUpdate(i){
    document.querySelectorAll('.node').forEach(n => n.classList.toggle('active', +n.dataset.index === i));
    const u = UPDATES[i];
    panel.innerHTML = `
      <div class="panel-tag">${u.tag}</div>
      <h3>${u.title}</h3>
      <p>${u.desc}</p>
      <div class="panel-date">${u.date}</div>
    `;
  }

  // auto-select first on load for context
  selectUpdate(0);
</script>

</body>
